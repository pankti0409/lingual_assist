<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FFF9E8" />
    <meta
      name="description"
      content="Lingual Assist helps people with speech impairments take part in conversation. It suggests replies from speech, context and gestures, and nothing is spoken until you confirm it."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Lingual Assist — Your words. Your choice. Your conversation.</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <style>
        .ns { font-family: Georgia, serif; color: #344B50; background: #F8F8F1; max-width: 46rem; margin: 0 auto; padding: 3rem 1.25rem 5rem; line-height: 1.6; }
        .ns h1 { font-size: 2.6rem; line-height: 1.1; margin: 1.5rem 0 1rem; }
        .ns h2 { font-size: 1.5rem; margin-top: 2.5rem; }
        .ns img { width: 100%; height: auto; border-radius: 1.5rem; }
        .ns ol li { margin: .4rem 0; }
        .ns .pill { display: inline-block; background: #DCE8CE; padding: .3rem .9rem; border-radius: 999px; font-weight: 700; }
      </style>
      <main class="ns">
        <h1>Your words. Your choice. Your conversation.</h1>
        <p class="pill">Nothing is spoken until you confirm it.</p>
        <p>Lingual Assist supports conversation for people whose speech is affected by conditions such as ALS, cerebral palsy, Parkinson’s disease, stroke or laryngectomy. It listens to both speakers, notices recent context and calibrated hand gestures, and suggests two or three replies. You choose, edit, reject or ask again. Only the exact message you confirm is spoken.</p>
        <h2>How it works</h2>
        <ol>
          <li><strong>Listen</strong> — the patient’s and partner’s turns are transcribed and labelled.</li>
          <li><strong>Notice context</strong> — the last few turns of the conversation are kept in view.</li>
          <li><strong>Combine signals</strong> — speech, a stable gesture you have calibrated, and mouth or head movement are combined as evidence.</li>
          <li><strong>Suggest</strong> — two or three short replies are offered, or a request to clarify.</li>
          <li><strong>Confirm</strong> — you review the exact words, edit them, reject them or ask again.</li>
          <li><strong>Speak</strong> — only the confirmed sentence is spoken, with a subtitle.</li>
        </ol>
        <h2>Privacy and consent</h2>
        <p>Recording, face and hand capture, voice cloning and demo use each need a separate choice, and every choice starts switched off. It does not diagnose, read emotions or turn lip movements into words.</p>
        <p><strong>The interactive application needs JavaScript.</strong> Please enable it to set up a session.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
